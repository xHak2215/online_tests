<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>тесты | личный кабинет</title>
  <link rel="stylesheet" href="/front/style.css" />
  <link id="favicon" rel="icon" type="image/x-icon" href="/front/favicon.ico">
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="dashboard">
    <aside class="sidebar">
      <div class="brand">
        <p>Личный кабинет</p>
        <p id="name_account">Загрузка...</p>
      </div>

      <nav class="menu">
        <a class="menu-link" href="#">Мои тесты</a>
        <a class="menu-link" href="/created_test">Создать тест</a>
        <a class="menu-link" href="#">Статистика</a>
        <a class="menu-link" href="#">Настройки</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <div>
        <p>затычка</p>  
        </div>
        <button class="submit-btn logout-btn">Выйти</button>
      </header>

      <section class="stats">
        <div class="stat-card">
          <h3>Активные тесты</h3>
          <p id="active_test">0</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {API_URL} from '/front/libs/conf.js';
    import {showToast} from '/front/libs/unit.js';
    
    const form = document.getElementById('testForm');
    const toast = document.getElementById('toast');

    if (document.cookie) {
      const cookies = document.cookie.split(";");
      const user_data = cookies[0].split("user_data=")[1];
      const devise_id = cookies[1].split("devise_id=")[1];

      const json_data = JSON.parse(user_data);

      const params = new URLSearchParams({
        token: JSON.parse(json_data.refresh_token)[devise_id]["token"],
        time: JSON.parse(json_data.refresh_token)[devise_id]["time"],
        devise_id: devise_id,
        name: json_data.name,
        surname: json_data.surname,
        email: json_data.email
      });

      const response = fetch(API_URL + `verify_refresh_token?${params}`)  
      .then(response => response.json())
      .then(result => {
        console.log(result);

        if (result.is_ok) {
          console.log("OK");
          document.getElementById('name_account').textContent = `${result.data.name} ${result.data.surname}`;

        } else if (result.details) {
          showToast(result.details, type="error");
        }
      })
      .catch(error => {
        console.error('Ошибка:', error);
        showToast('Ошибка отправки', type="error");
      });
    }

  </script>
</body>
</html>
