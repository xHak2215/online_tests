<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css" />
  <link id="favicon" rel="icon" type="image/x-icon" href="/front/favicon.ico">

</head>
<body>
  <div class="container">
    <form class="register-box" id="registerForm">
      <h2>Регистрация</h2>

      <div class="role-switch">
        <button type="button" class="role-btn active" data-role="teacher">Учитель</button>
        <button type="button" class="role-btn" data-role="student">Ученик</button>
      </div>

      <input type="hidden" id="role" name="role" value="teacher" />

      <label for="name">Имя</label>
      <input type="text" id="name" placeholder="Введите имя" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Введите email" required />

      <label for="password">Пароль</label>
      <input type="password" id="password" placeholder="Введите пароль" required />

      <div id="teacherFields">
        <label for="subject">Предмет</label>
        <input type="text" id="subject" placeholder="Например: Математика" />
      </div>

      <div id="studentFields" style="display: none;">
        <label for="class">Класс</label>
        <input type="text" id="class" placeholder="Например: 8А" />
      </div>

      <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>
  </div>

<script>
  const API_URL = 'http://192.168.0.108:8810/api/v1'

  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const data = {
      role: document.getElementById('role').value,
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      subject: document.getElementById('subject').value,
      class: document.getElementById('class').value
    };

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      console.log(result);
      alert('Данные отправлены!');
    } catch (error) {
      console.error(error);
      alert('Ошибка отправки');
    }
  });
</script>
</body>
</html>
